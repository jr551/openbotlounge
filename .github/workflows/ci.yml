# Everything this repository claims about itself, checked on every push.
#
# The image only publishes when the checks are green — `publish` needs both
# `verify` and `secrets`, so a red test run cannot ship a container.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    # Fork PRs must not run on self-hosted runners — untrusted code would execute
    # on the operator's hardware with access to sibling secrets and the network.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, supermicro-server]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Dockerfile builds on node:24-slim and the README requires 24+.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, supermicro-server]
    steps:
      - uses: actions/checkout@v7

      # Scans the checked-out tree, not the git history: this repository is
      # published as a single squashed commit, so the tree is the history.
      # --no-git also sidesteps git's container-ownership complaint.
      #
      # The allowlist in .gitleaks.toml covers the fabricated credential
      # fixtures the redaction tests need; it names those values rather than
      # excluding test files, so a real key in a test is still caught.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --no-git \
              --config=/repo/.gitleaks.toml --redact --verbose

  publish:
    name: Publish image to GHCR
    needs: [verify, secrets]
    if: github.event_name == 'push'
    runs-on: [self-hosted, supermicro-server]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        # GHCR needs a lowercase path; a repository name may not be.
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # amd64 for the Linux host this deploys to, arm64 for the Steam Deck
          # it was developed on.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
